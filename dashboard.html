<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | DESCO Prepaid Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-light bg-white shadow-sm px-4 d-flex justify-content-between">
    <button class="btn btn-outline-secondary d-md-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
      <img src="assets/logo.png" alt="DESCO Logo" width="32">
      DESCO Prepaid Portal
    </a>
    
    <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
  </nav>

  <div class="overlay" id="sidebarOverlay"></div>
  <div class="container-fluid">
    <div class="row">
      <!-- Side Nav -->
      <div class="col-md-2 sidebar sidebar-collapse py-4 px-3 position-md-static" id="sidebar">
        <ul class="nav nav-pills flex-column" id="sectionNav">
          <li class="nav-item">
            <a class="nav-link active" href="#" data-section="overview">
              <i class="bi bi-info-circle"></i> Overview
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-section="daily">
              <i class="bi bi-activity"></i> Daily Consumption
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-section="recharge">
              <i class="bi bi-wallet2"></i> Recharge History
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-section="monthly">
              <i class="bi bi-bar-chart-line"></i> Monthly Consumption
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-section="comparison">
              <i class="bi bi-columns-gap"></i> Monthly Comparison
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-section="rvc">
              <i class="bi bi-graph-up"></i> Recharge vs Consumption
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-section="demand">
              <i class="bi bi-lightning"></i> Max Demand
            </a>
          </li>
        </ul>
      </div>

      <!-- Main Content -->
      <div class="col-md-10 py-4 px-4" id="mainContent">
        <div id="dashboardContent">
          <div id="overview" class="section active"></div>
          <div id="daily" class="section"></div>
          <div id="recharge" class="section"></div>
          <div id="monthly" class="section"></div>
          <div id="comparison" class="section"></div>
          <div id="rvc" class="section"></div>
          <div id="demand" class="section"></div>
        </div>

        <div id="loadingIndicator" class="text-center my-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-4 mb-3 small text-muted">
    <div>Last Updated: <span id="lastUpdated">--</span></div>
    <div>Made with 💡 by <a href="https://www.linkedin.com/in/tousif-md-amin-faisal/" target="_blank">Tousif Md Amin Faisal</a></div>
    <div><small>This project is not affiliated with or endorsed by DESCO</small></div>
  </footer>  

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/app-init.js"></script>
  <script src="js/sections/overview.js"></script>
  <script src="js/sections/daily.js"></script>
  <script src="js/sections/recharge.js"></script>
  <script src="js/sections/monthly.js"></script>
  <script src="js/sections/comparison.js"></script>
  <script src="js/sections/rvc.js"></script>
  <script src="js/sections/demand.js"></script>
  <script src="js/utils/export.js"></script>
  <script>
    $('#sectionNav .nav-link').click(function(e) {
      e.preventDefault();
      const section = $(this).data('section');
      $('.section').removeClass('active');
      $('#' + section).addClass('active');
      $('#sectionNav .nav-link').removeClass('active');
      $(this).addClass('active');

      $('#sidebar').removeClass('show');
      $('#sidebarOverlay').removeClass('show');
    });

    $('#sidebarToggle').click(() => {
      $('#sidebar').toggleClass('show');
      $('#sidebarOverlay').toggleClass('show');
    });

    $('#sidebarOverlay').click(() => {
      $('#sidebar').removeClass('show');
      $('#sidebarOverlay').removeClass('show');
    });

    const interval = setInterval(() => {
      const overview = document.getElementById('overview');
      if (overview && overview.children.length > 0) {
        $('#loadingIndicator').hide();
        $('#dashboardContent').show();
        clearInterval(interval);
      }
    }, 300);
  </script>
</body>
</html>
