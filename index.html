<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | DESCO Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
</head>
<body class="login-body">
  <div class="login-container">
    <h2 class="text-center">DESCO Prepaid Portal</h2>
    <form id="loginForm">
      <div class="form-group mb-3">
        <label for="accountNo">Account No / Meter No</label>
        <input type="text" id="accountNo" class="form-control" placeholder="Enter Account No or Meter No" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
