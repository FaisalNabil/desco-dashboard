<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | DESCO Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SJTFWHGK5K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-SJTFWHGK5K');

<body class="d-flex flex-column min-vh-100">

  <div class="login-container text-center">
    <div class="text-center mb-4">
      <img src="assets/logo.png" alt="DESCO Logo" width="64" class="mb-2">
      <h2 class="mb-0">DESCO Prepaid Portal</h2>
      <p class="text-muted small">Unofficial consumer dashboard</p>
    </div>    
    
    <form id="loginForm">
      <div class="form-group mb-3 text-center">
        <label for="accountNo" class="fw-semibold">DESCO Account / Meter No</label>
        <input type="text" id="accountNo" class="form-control text-center" placeholder="e.g. 1234567890" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div id="recentAccounts" class="mt-3"></div>
  </div>

  <footer>
    <div>Made with 💡 by <a href="https://www.linkedin.com/in/tousif-md-amin-faisal/" target="_blank">Tousif Md Amin Faisal</a></div>
    <div><small>This project is not affiliated with or endorsed by DESCO</small></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
